apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-custom-webapp
  labels:
    app: custom-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: custom-web
  template:
    metadata:
      labels:
        app: custom-web
    spec:
      containers:
      - name: web-container
        image: ghcr.io/fbsoul/ansible/my-web-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-webapp-service
spec:
  type: NodePort
  selector:
    app: custom-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 32080
