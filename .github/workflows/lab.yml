name: Runner Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show system information
        run: |
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Working directory: $(pwd)"
          echo "Kernel:"
          uname -a
          echo
          echo "Git version:"
          git --version
          echo
          echo "Ansible:"
          ansible --version
          echo
          echo "Kubectl:"
          kubectl version --client
