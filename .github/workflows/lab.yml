name: Runner Lab

on:
  workflow_dispatch:

jobs:
  runner-test:
    name: Test Self-Hosted Runner
    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display system information
        run: |
          echo "================================="
          echo "GitHub Actions Runner Information"
          echo "================================="
          echo "Hostname : $(hostname)"
          echo "User     : $(whoami)"
          echo "Date     : $(date)"
          echo "Kernel   : $(uname -r)"
          echo "Directory: $(pwd)"
          echo

      - name: Verify Git
        run: git --version

      - name: Verify Ansible
        run: ansible --version

      - name: Verify kubectl
        run: kubectl version --client

      - name: Show PATH
        run: |
          echo "PATH=$PATH"

      - name: Locate important tools
        run: |
          which git
          which ansible
          which kubectl

      - name: Verify K3s
        run: kubectl get nodes
